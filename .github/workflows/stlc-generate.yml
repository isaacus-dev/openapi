name: Generate SDKs with stlc

# One workflow, two modes:
# - pull_request: build every target, push a preview branch per staging repo, sticky-comment diff links.
# - push to main (or manual dispatch): back-sync release commits from production into staging,
#   build and push staging main directly (Promote then fast-forwards production), then seal
#   tracking files back here.
#
# There is deliberately no cron here, and nothing runs unless you push. The schedule this
# workflow used to carry was not the backstop its comment claimed: the `repository_dispatch`
# chain it was meant to back up never fired even once, because the PATs those dispatch jobs
# needed (CONFIG_DISPATCH_TOKEN, STAGING_DISPATCH_TOKEN) were never created, so both jobs hit
# their "not configured" skip on every run. The cron was doing 100% of the sync work — and
# was the sole source of the no-op seal PR churn. Rather than reinstate that cross-repo
# chain, the back-sync it depended on now runs inline below, with the credentials this
# workflow already has. If you are tempted to add a schedule back, add the missing sync
# to the push path instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stainless/**'
      - '.github/workflows/stlc-generate.yml'
      - '.github/actions/setup-stlc/**'
  push:
    branches: [main]
    paths:
      - 'stainless/**'
      - '.github/workflows/stlc-generate.yml'
      - '.github/actions/setup-stlc/**'
  workflow_dispatch: {}

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual rebuild and tracking sync' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  STAINLESS_WORKSPACE: stainless
  DEFAULT_TARGETS: all

jobs:
  guard:
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Decide whether this change only touches tracking files
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT" in
            push | pull_request) ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename')
          echo "Changed files:"; printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^stainless/custom-code/'; then
            echo "Only tracking files changed — skipping regeneration (loop-breaker)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup stlc
        uses: ./.github/actions/setup-stlc
        with:
          stlc-read-token: ${{ secrets.STLC_READ_TOKEN }}

      - name: Configure auth for stlc to push to SDK repos
        env:
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
        run: |
          git config --global user.name "stlc-bot"
          git config --global user.email "stlc-bot@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve commit message
        id: msg
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK: ${{ github.event.head_commit.message }}
        run: |
          pr_title=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].title // empty')

          if [ -n "$pr_title" ]; then
            commit_msg="$pr_title"
          else
            commit_msg="$FALLBACK"
          fi

          {
            echo "commit_msg<<MSG_EOF"
            echo "$commit_msg"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Back-sync production into staging
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAINLESS_WORKSPACE }}
        env:
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          # Release commits (version bumps, changelogs) land on the production repos, so a
          # staging trunk trails production after every release and codegen would otherwise
          # rebuild on a stale base. Fast-forward staging from production right here, so a
          # push to this repo is the only event the pipeline ever needs. This replaces the
          # cross-repo back-sync workflow that used to poll every 30 minutes.
          ls_heads() { git -c credential.helper= ls-remote --heads "$1" main; }

          diverged=""
          while IFS=$'\t' read -r target staging prod; do
            { [ -z "$prod" ] || [ "$prod" = "null" ] || [ "$staging" = "$prod" ]; } && continue

            prod_url="https://github.com/${prod}.git"
            if ! prod_heads=$(ls_heads "$prod_url"); then
              prod_url="https://x-access-token:${GH_TOKEN}@github.com/${prod}.git"
              if ! prod_heads=$(ls_heads "$prod_url"); then
                echo "::warning title=Back-sync skipped for ${target}::production repo ${prod} is unreachable with the configured credential. The build proceeds on staging as-is; grant the token read access to ${prod} to enable the back-sync."
                continue
              fi
            fi

            [ -z "$prod_heads" ] && continue

            staging_url="https://x-access-token:${GH_TOKEN}@github.com/${staging}.git"
            if ! staging_heads=$(ls_heads "$staging_url"); then
              echo "::warning title=Back-sync skipped for ${target}::staging repo ${staging} is unreachable. If this is not transient, the build step will fail loudly on its own."
              continue
            fi

            [ -z "$staging_heads" ] && continue

            d=$(mktemp -d); git -C "$d" init -q
            git -C "$d" -c credential.helper= fetch -q "$staging_url" main:refs/remotes/staging/main
            git -C "$d" -c credential.helper= fetch -q "$prod_url" main:refs/remotes/prod/main

            if git -C "$d" merge-base --is-ancestor prod/main staging/main; then
              echo "${target}: staging already contains production — nothing to back-sync."
            elif git -C "$d" merge-base --is-ancestor staging/main prod/main; then
              git -C "$d" -c credential.helper= push -q "$staging_url" prod/main:refs/heads/main
              echo "${target}: fast-forwarded ${staging} main to ${prod} main."
            else
              # Neither is an ancestor of the other, so something was committed to production
              # outside the promote path. Fast-forwarding would silently drop it — stop instead.
              diverged="$diverged $target"
            fi
            rm -rf "$d"
          done < <(yq -r '.targets | to_entries[] | [.key, (.value.staging_repo // .value.production_repo), (.value.production_repo // .value.staging_repo)] | @tsv' openapi.stainless.yml)

          if [ -n "$diverged" ]; then
            echo "::error title=Back-sync blocked::staging and production have diverged for:$diverged. Production carries commits that are not on the staging trunk, so it cannot be fast-forwarded. Reconcile by hand, then re-run."
            exit 1
          fi
          echo "Staging trunks are level with production — proceeding to build."

      - name: Generate SDKs and push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          COMMIT_MSG: ${{ steps.msg.outputs.commit_msg }}
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN }}
        working-directory: ${{ env.STAINLESS_WORKSPACE }}
        run: |
          echo "Building targets: $DEFAULT_TARGETS to branch: $BRANCH"
          commit_args=()
          if [ -n "$COMMIT_MSG" ]; then
            commit_args=(--commit "$COMMIT_MSG")
          fi
          stlc build \
            --branch "$BRANCH" \
            --trunk-branch main \
            --output /tmp/sdk-output \
            --push \
            --targets "$DEFAULT_TARGETS" \
            "${commit_args[@]}"

      - name: Render build manifest
        id: manifest
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ env.STAINLESS_WORKSPACE }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! stlc show --renderer=markdown --workflow-run-url "$RUN_URL" > /tmp/build-manifest.md; then
            {
              echo "## stlc build manifest"
              echo ""
              echo "Manifest render failed — no sticky comment will be posted."
              echo "See the \"Generate SDKs and push\" step above for the underlying error."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/build-manifest.md
          cat /tmp/build-manifest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment build manifest on PR
        if: always() && steps.manifest.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: stlc-build-manifest
          path: /tmp/build-manifest.md

      - name: Seal tracking files back to the config repo
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.SDK_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain -- "$STAINLESS_WORKSPACE/custom-code")" ]; then
            echo "Tracking files already in sync — nothing to seal."
            exit 0
          fi

          # `stlc build` writes a fresh empty `seal` commit into each SDK repo on every
          # run, so `base`/`integrated` get a new SHA even when the generated code is
          # byte-identical. Sealing that opens a no-op PR per run (and force-pushes the
          # open one, mailing every watcher). Resolve each SHA to the tree it points at
          # and skip when no tree actually moved. Anything we cannot resolve is treated
          # as a real change, so the guard can only ever suppress verified churn.
          declare -A repo_of
          while IFS=$'\t' read -r target repo; do
            repo_of["$target"]="$repo"
          done < <(yq -r '.targets | to_entries[] | [.key, (.value.staging_repo // .value.production_repo)] | @tsv' "$STAINLESS_WORKSPACE/openapi.stainless.yml")

          tree_of() { gh api "repos/$1/commits/$2" --jq '.commit.tree.sha' 2>/dev/null; }

          substantive=0
          while IFS= read -r line; do
            state="${line:0:2}"; path="${line:3}"

            case "$state" in
              " M" | "M " | "MM") ;;
              *) echo "$path: $state is not a plain modification — real change."; substantive=1; break ;;
            esac

            target="$(basename "$(dirname "$path")")"
            repo="${repo_of[$target]:-}"
            if [ -z "$repo" ]; then
              echo "$path: no repo configured for target '$target' — real change."
              substantive=1; break
            fi

            old_json="$(git show "HEAD:$path")" || { substantive=1; break; }
            new_json="$(cat "$path")"

            old_rest="$(printf '%s' "$old_json" | jq -S 'del(.base, .integrated)')" || old_rest=""
            new_rest="$(printf '%s' "$new_json" | jq -S 'del(.base, .integrated)')" || new_rest=""
            if [ -z "$old_rest" ] || [ "$old_rest" != "$new_rest" ]; then
              echo "$path: fields other than base/integrated changed — real change."
              substantive=1; break
            fi

            for field in base integrated; do
              o="$(printf '%s' "$old_json" | jq -r --arg f "$field" '.[$f] // ""')" || o=""
              n="$(printf '%s' "$new_json" | jq -r --arg f "$field" '.[$f] // ""')" || n=""
              [ "$o" = "$n" ] && continue
              if [ -z "$o" ] || [ -z "$n" ]; then
                echo "$path: $field missing on one side — real change."
                substantive=1; break 2
              fi
              ot="$(tree_of "$repo" "$o")" || ot=""
              nt="$(tree_of "$repo" "$n")" || nt=""
              if [ -z "$ot" ] || [ -z "$nt" ]; then
                echo "$path: cannot resolve $field ($o -> $n) in $repo — real change."
                substantive=1; break 2
              fi
              if [ "$ot" != "$nt" ]; then
                echo "$path: $field tree moved ($ot -> $nt) — real change."
                substantive=1; break 2
              fi
              echo "$path: $field $o -> $n, but tree $ot is unchanged — SHA churn."
            done
          done < <(git status --porcelain -- "$STAINLESS_WORKSPACE/custom-code")

          if [ "$substantive" -eq 0 ]; then
            echo "Every tracking-file change is empty-seal SHA churn — discarding, no PR."
            git checkout HEAD -- "$STAINLESS_WORKSPACE/custom-code"
            exit 0
          fi

          # Committed straight to main rather than raised as a PR. A seal is bookkeeping —
          # it records the SHAs of custom code that already exists in the SDK repos, so
          # there is no decision in it to review, and an unmerged seal PR blocks later
          # builds. The `guard` job skips regeneration for tracking-files-only pushes, so
          # this cannot loop. The churn guard above still runs first, so SHA-only churn is
          # discarded rather than committed.
          target_branch="${GITHUB_REF_NAME}"
          push_url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          staged="$(mktemp -d)"
          cp -a "$STAINLESS_WORKSPACE/custom-code/." "$staged/"

          for attempt in 1 2 3; do
            # Re-anchor on the current tip each time: main may have moved while we built.
            git fetch -q --depth=1 "$push_url" "$target_branch"
            git checkout -q -B stlc-seal FETCH_HEAD
            rm -rf "${STAINLESS_WORKSPACE:?}/custom-code"
            mkdir -p "$STAINLESS_WORKSPACE/custom-code"
            cp -a "$staged/." "$STAINLESS_WORKSPACE/custom-code/"
            git add -A "$STAINLESS_WORKSPACE/custom-code"

            if git diff --cached --quiet; then
              echo "Tracking files already sealed on ${target_branch} — nothing to push."
              exit 0
            fi

            git commit -q -m "chore(stlc): seal custom-code tracking files"
            if git push -q "$push_url" "HEAD:refs/heads/${target_branch}"; then
              echo "Sealed custom-code tracking files onto ${target_branch}."
              exit 0
            fi
            echo "Push rejected (${target_branch} moved) — retrying (attempt ${attempt}/3)."
          done

          echo "::error title=Seal failed::could not push tracking files to ${target_branch} after 3 attempts. Stale tracking files block later builds — reseal by re-running this workflow."
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.STLC_ALERT_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="stlc generate failed in ${{ github.repository }} (${{ github.event_name }}). SDK builds and the custom-code tracking sync are stalled until this is fixed — investigate before the next build. Run: $run_url"
          echo "::error title=stlc workflow failed::$msg"
          { echo "### ⚠️ stlc workflow failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg text "$msg" '{text:$text}')" "$ALERT_WEBHOOK_URL" \
              || echo "::warning::Alert webhook POST failed"
          fi
